.wind-btn{justify-content:center}
.gradient{text-align:center}
#note-input{width:100%;background:var(--moss-2);border:1px solid var(--line);color:var(--chalk);

.note-acts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.note-state{font-size:12.5px;color:var(--muted)}

  padding:10px 16px;font-weight:700;font-size:14px}
.note-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.note-list li{background:var(--moss-2);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.note-list .txt{font-size:14px;white-space:pre-wrap;word-break:break-word}
.note-list .meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.note-list li.pin{border-color:var(--amber)}
.note-list li.pin .meta{color:var(--amber);letter-spacing:.05em;text-transform:uppercase;font-size:10.5px}
.note-list .pinned{border-color:rgba(232,163,61,.45)}
.note-list .del{background:none;border:0;color:var(--muted);font-size:15px;padding:2px 4px}
.gradient .cta{background:var(--moss-2);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font-size:14px;color:var(--chalk);width:100%;line-height:1.4}
.gradient svg{width:min(168px,44vw);height:min(168px,44vw);display:block;margin:2px auto 0}
.g-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g-tile{background:var(--moss-2);border:1px solid var(--line);border-radius:16px;padding:12px 8px 14px;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.g-cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.big-n{font-family:Fraunces,serif;font-size:40px;font-weight:800;line-height:1}
.big-u{font-size:12px;color:var(--muted);margin-top:2px}
.big-pc{font-size:22px;margin-left:1px}

.big-dir.is-left{color:var(--breeze)}

.dial-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.dial-row button{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:var(--moss);
  border:1px solid var(--line);color:var(--chalk);font-size:21px;line-height:1}
.dial-row input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:34px;background:none}
.dial-row input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--track)}

.dial-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:var(--amber);border:2px solid var(--moss);margin-top:-10px}

.dial-val{font-family:Fraunces,serif;font-size:30px;font-weight:800;line-height:1}
.dial-val small{font-size:13px;font-weight:400;color:var(--muted);font-family:Karla,sans-serif;margin-left:5px}
.putt-calc{background:var(--moss-2);border:1px solid var(--line);border-radius:16px;

.putt-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}

.putt-unit{font-size:13px;color:var(--muted)}
.putt-out{margin:10px 0 0;font-size:15px;color:var(--muted)}
.putt-out b{font-family:Fraunces,serif;font-size:26px;font-weight:800;color:var(--amber);vertical-align:-2px}
.g-line{font-size:14.5px;color:var(--muted);line-height:1.5}
.g-line b{color:var(--chalk);font-weight:700}
.g-acts{display:flex;gap:8px;justify-content:center;margin-top:14px}
.g-acts button{background:var(--moss-2);border:1px solid var(--line);color:var(--chalk);
  border-radius:12px;padding:9px 14px;font-size:13px}
.g-sub{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.finder button{
  background:var(--moss);border:1px solid var(--line);color:var(--chalk);
  padding:12px 18px;border-radius:14px;white-space:nowrap;
}
.browse{margin-bottom:12px}
.tools{display:grid;gap:10px;margin-bottom:22px}
.browse[hidden]{display:none}
.finder button.locate{background:var(--amber);color:var(--on-amber);border-color:transparent;font-weight:700}
.results{list-style:none;margin:-4px 0 20px;padding:0;background:var(--moss);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#courses{width:100%;background:var(--moss);border:1px solid var(--line);color:var(--chalk);padding:11px 14px;border-radius:999px;font:inherit}
#banner{background:rgba(232,163,61,.12);border:1px solid rgba(232,163,61,.4);color:var(--chalk);
  padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;margin:0 0 18px}
.results .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid var(--line);padding:1px 6px;border-radius:99px}
.results li button{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 16px;border-bottom:1px solid var(--line)}

/* ── hero ── */
.hero{margin-bottom:8px}
/* ── on-course wind panel ── */
.wind-btn{background:var(--breeze);border:1px solid transparent;color:var(--on-breeze);
  padding:12px 18px;border-radius:14px;white-space:nowrap;display:flex;align-items:center;gap:9px;font-weight:700}

.wind-btn .mini svg circle{stroke:rgba(255,255,255,.45)}
.wind-btn .mini svg line, .wind-btn .mini svg circle[fill]{stroke:currentColor;fill:currentColor}
.wind-panel{background:var(--moss);border:1px solid var(--line);border-radius:18px;padding:16px}
.compass{text-align:center}
.compass svg{width:min(220px,58vw);height:min(220px,58vw);display:block;margin:2px auto 0}
.compass .cta{margin:2px auto 0;background:var(--moss-2);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font-size:14px;color:var(--chalk);width:100%;line-height:1.4}
.compass .read{font-size:15px;color:var(--muted);margin-top:12px;line-height:1.45}
.compass .read b{color:var(--chalk);font-weight:700}
.compass .sub{font-size:12.5px;color:var(--muted);margin-top:8px}
.place{color:var(--muted);font-size:14px;margin-bottom:6px}
.verdict{font-size:clamp(30px,9vw,42px);line-height:1.06;margin-bottom:10px}
.verdict em{font-style:normal;color:var(--amber)}
.subline{color:var(--muted);max-width:44ch;margin-bottom:20px}

/* ── the ribbon: the day, sunrise to sunset ── */
.ribbon-wrap{margin:0 0 10px}
.ribbon{
  display:flex;gap:1.5px;height:74px;align-items:flex-end;
  padding:0;margin:0;list-style:none;
}
.ribbon li{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.ribbon .bar-fill{width:100%;border-radius:3px 3px 2px 2px;transition:opacity .15s}
.ribbon li[aria-selected="true"] .bar-fill{box-shadow:0 0 0 2px var(--chalk) inset}
.ribbon button{background:none;border:0;padding:0;width:100%;height:100%;display:flex;align-items:flex-end}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px;letter-spacing:.02em}

/* ── picked window detail ── */
.detail{background:var(--moss);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0 22px}
.detail-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.tee{font-family:Fraunces,serif;font-size:34px;font-weight:600;letter-spacing:-.02em}
.score{font-family:Fraunces,serif;font-size:34px;font-weight:800}

.factors{list-style:none;margin:0;padding:0;display:grid;gap:9px}

.factors .k{color:var(--muted)}
.track{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.track span{display:block;height:100%;border-radius:99px}
.note{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:14px;color:var(--chalk)}
.note b{color:var(--amber);font-weight:700}

/* ── controls ── */
.holes{display:flex;gap:6px;margin:0 0 18px}
.holes button{background:var(--moss);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.holes button[aria-pressed="true"]{background:var(--chalk);color:var(--pine);border-color:transparent;font-weight:700}

/* ── week ── */
h2.sec{font-size:20px;margin:26px 0 6px}
.week-hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.week{list-style:none;margin:0;padding:0}
.backday{background:var(--moss);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 14px;font-size:13px;margin-bottom:14px}
.week li{cursor:pointer}
.week li[aria-current="true"]{opacity:.55}
.week .go{color:var(--muted);font-size:15px;margin-left:2px}
.week li{display:grid;grid-template-columns:62px 1fr auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.week .date{font-weight:400;color:var(--muted);font-size:12.5px}
.tl-head{font-size:15px;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.timeline li{display:grid;grid-template-columns:54px 68px 20px 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.timeline .tl-time{color:var(--chalk);font-weight:700}
.timeline .tl-note{text-align:right;white-space:nowrap}
.alts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.alts .alt{display:flex;align-items:center;gap:8px;background:var(--moss);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px}
.alt-score{font-family:Fraunces,serif;font-weight:800}
.ic{display:inline-block;vertical-align:-3px;flex:0 0 auto}
.tl-icon{display:flex;justify-content:center;color:var(--muted)}
.alt-ic{display:flex;color:var(--muted)}
.score-icon{margin-right:9px;display:inline-block;vertical-align:-4px;color:var(--muted)}
.week .day{font-weight:700}
.week .when{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:7px}
.chip{font-family:Fraunces,serif;font-weight:800;font-size:17px;padding:2px 10px;border-radius:8px;color:var(--chip-ink)}

  text-decoration:underline;text-underline-offset:3px}
.awake[aria-pressed="false"]{opacity:.65}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let STATE = { holes: 18, lat: null, lon: null, label: '', data: null, sel: null, day: 0, focus: null, gps: false };

const ROUND_MIN  = { 18: 258, 9: 126 };   // 4h18 / 2h06 including warm-up walk
const LAST_TEE   = { 18: 13.0, 9: 15.0 };  // club cut-off, decimal hours
const STEP_MIN   = 30;                     // tee slots every half hour

/* ---------- scoring ---------- */
function hourScore(h){
  let s = 100, why = {};
  const rainPen = Math.min(45, h.pop * 0.28 + Math.min(h.precip, 8) * 6);
  const windPen = Math.max(0, h.wind - 8) * 2.2 + Math.max(0, h.gust - 16) * 1.3;
  const heatPen = h.feels > 34 ? (h.feels - 34) * 2.0 + Math.max(0, h.feels - 40) * 4.5
                : (h.feels < 10 ? (10 - h.feels) * 2.6 : 0);
  const thunder = [95,96,99].includes(h.code);
  const stormPen = thunder ? 55 : (h.cape > 2000 ? 22 : h.cape > 1200 ? 10 : 0)
                 + ([80,81,82].includes(h.code) ? 12 : 0);
  const uvPen = h.uv > 10 ? 5 : 0;
  s -= rainPen + Math.min(35, windPen) + Math.min(35, heatPen) + stormPen + uvPen;
  why = { rain: rainPen, wind: Math.min(35, windPen), heat: Math.min(35, heatPen), storm: stormPen };
  return { score: Math.max(0, Math.round(s)), why };
}

function windowScore(hours, startTime, mins, sunsetT){
  const end = new Date(startTime.getTime() + mins*60000);
  const parts = [];
  hours.forEach(h => {
    const a = h.t.getTime(), b = a + 3600000;
    const overlap = Math.min(b, end.getTime()) - Math.max(a, startTime.getTime());
    if (overlap > 0) parts.push({ h, mins: overlap/60000, ...hourScore(h) });
  });
  if (!parts.length) return null;
  const total = parts.reduce((s,p)=>s+p.mins, 0);
  if (total < mins - 61) return null;                  // forecast runs out
  const avg = parts.reduce((s,p)=>s + p.score * p.mins, 0) / total;
  const worst = Math.min(...parts.map(p=>p.score));
  let s2 = avg - (avg - worst) * 0.55;                 // a bad patch ruins a round
  const darkMin = Math.max(0, (end - sunsetT) / 60000);
  s2 -= Math.min(70, darkMin * 0.55);
  const agg = { rain:0, wind:0, heat:0, storm:0 };
  parts.forEach(p => { for (const k in agg) agg[k] += p.why[k] * p.mins / total; });
  return {
    score: Math.max(0, Math.round(s2)), start: startTime, finish: end,
    slice: parts.map(p=>p.h), parts, agg, darkMin, worst
  };
}

function troubleOf(why){
  const worst = Object.entries(why).sort((a,b)=>b[1]-a[1])[0];
  if (worst[1] < 6) return null;
  return { key: { rain:'Rain', wind:'Wind', heat:'Heat', storm:'Storms' }[worst[0]], pen: worst[1] };
}

function icon(name, size){
  return `<svg class="ic" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"
    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[name] || ''}</svg>`;

function conditionOf(hours){
  const a = k => hours.reduce((s,h)=>s+(h[k]||0),0)/hours.length;
  const thunder = hours.some(h => [95,96,99].includes(h.code)) || a('cape') > 2000;
  const rain = a('precip'), pop = a('pop'), cloud = a('cloud');
  if (thunder)        return { key:'storm',  word:'Thunderstorms' };
  if (rain > 2.5)     return { key:'rain',   word:'Heavy rain' };
  if (pop > 55 || rain > 0.4) return { key:'shower', word:'Showers' };
  if (cloud > 70)     return { key:'cloud',  word:'Overcast' };
  if (cloud > 35)     return { key:'part',   word:'Partly cloudy' };
  return { key:'sun', word:'Sunny' };
}

const tone = s => s >= 80 ? 'var(--good)' : s >= 62 ? 'var(--fair)' : s >= 40 ? 'var(--amber)' : 'var(--poor)';
const verdictWord = s => s >= 85 ? 'Play' : s >= 70 ? 'Good round' : s >= 55 ? 'Playable' : s >= 35 ? 'Grind' : 'Sit it out';
const fmt = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });

/* ---------- data ---------- */
async function load(lat, lon, label){
  STATE.lat = lat; STATE.lon = lon; STATE.label = label;
  const sc = document.getElementById('courses');
  if (sc && !(sc.selectedIndex > 0 && sc.options[sc.selectedIndex].text === label)) sc.selectedIndex = 0;
  app.innerHTML = '<p class="msg">Reading the sky over ' + esc(label) + '…</p>';
  const url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
    '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,uv_index,relative_humidity_2m,cloud_cover,cape'+
    '&daily=sunrise,sunset,precipitation_sum&timezone=auto&forecast_days=8&wind_speed_unit=mph';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('Forecast service returned ' + r.status);
    const j = await r.json();
    STATE.data = parse(j);
    STATE.day = 0; STATE.sel = null; STATE.focus = null;
    render();
  } catch (e) {
    STATE.data = demoData(lat);
    STATE.day = 0; STATE.sel = null;
    showBanner('Showing sample conditions. This preview window blocks outside connections, so the live forecast can\'t load here — download the file and open it in a browser and it pulls real data for any location.');
    render();
  }
}

function parse(j){
  const H = j.hourly;
  const hours = H.time.map((t,i)=>({
    t: new Date(t),
    temp: H.temperature_2m[i], feels: H.apparent_temperature[i],
    pop: H.precipitation_probability[i] ?? 0, precip: H.precipitation[i] ?? 0,
    code: H.weather_code[i], wind: H.wind_speed_10m[i], gust: H.wind_gusts_10m[i],
    dir: H.wind_direction_10m[i], uv: H.uv_index[i] ?? 0, rh: H.relative_humidity_2m[i],
    cloud: H.cloud_cover?.[i] ?? 50, cape: H.cape?.[i] ?? 0
  }));
  const days = j.daily.time.map((d,i)=>({
    date: new Date(d + 'T12:00'),
    sunrise: new Date(j.daily.sunrise[i]), sunset: new Date(j.daily.sunset[i]),
    rainSum: j.daily.precipitation_sum[i]
  }));
  return { hours, days, tz: j.timezone };
}

function showBanner(t){ const b = $('#banner'); b.hidden = false; b.textContent = t; }

/* Sample tropical-monsoon day pattern, used only when the network is unavailable. */
function demoData(lat){
  const tropical = Math.abs(+lat) < 25;
  const hours = [], days = [];
  const base = new Date(); base.setMinutes(0,0,0);
  const start = new Date(base); start.setHours(0);
  for (let d = 0; d < 8; d++){
    const day = new Date(start.getTime() + d*864e5);
    const mood = [0.35,0.9,0.2,0.6,1.0,0.45,0.3,0.7][d];   // 1 = wet & stormy
    for (let h = 0; h < 24; h++){
      const t = new Date(day.getTime() + h*36e5);
      const solar = Math.max(0, Math.sin((h - 6) / 12 * Math.PI));
      const temp = (tropical ? 25 : 15) + solar * (tropical ? 8 : 9);
      const conv = Math.max(0, Math.sin((h - 11) / 9 * Math.PI));  // afternoon build-up
      const pop = Math.min(95, Math.round(conv * 90 * mood + 8));
      const precip = pop > 55 ? +(conv * 4 * mood).toFixed(1) : 0;
      hours.push({
        t, temp: +temp.toFixed(1),
        feels: +(temp + (tropical ? 4.5 * solar : 1)).toFixed(1),
        pop, precip,
        code: pop > 80 && mood > 0.8 ? 95 : pop > 60 ? 80 : 3,
        wind: +(5 + solar * 7 * mood + 2).toFixed(1),
        gust: +(9 + solar * 13 * mood).toFixed(1),
        dir: 250, uv: +(solar * 11).toFixed(1), cloud: Math.round(30 + conv*60*mood), cape: Math.round(conv*2600*mood),
        rh: Math.round(95 - solar * 25 + mood * 5)
      });
    }
    const sr = new Date(day); sr.setHours(5,45);
    const ss = new Date(day); ss.setHours(18,5);
    days.push({ date: new Date(day.getTime() + 12*36e5), sunrise: sr, sunset: ss, rainSum: +(mood*18).toFixed(1) });
  }
  return { hours, days, tz: 'local', demo: true };
}

/* ---------- day analysis ---------- */
function analyseDay(di){
  const { hours, days } = STATE.data, d = days[di];
  const mins = ROUND_MIN[STATE.holes];
  const cap = new Date(d.date); cap.setHours(Math.floor(LAST_TEE[STATE.holes]),
    (LAST_TEE[STATE.holes] % 1) * 60, 0, 0);
  const lastTee = new Date(Math.min(cap.getTime(), d.sunset.getTime() - mins*60000));
  let t = new Date(d.sunrise);
  t.setMinutes(t.getMinutes() > 30 ? 60 : 30, 0, 0);          // first slot after sunrise
  if (di === 0){
    const now = new Date();
    if (now > t){ t = new Date(now); t.setMinutes(t.getMinutes() > 30 ? 60 : 30, 0, 0); }
  }
  const slots = [];
  while (t <= lastTee){
    const w = windowScore(hours, new Date(t), mins, d.sunset);
    if (w) slots.push(w);
    t = new Date(t.getTime() + STEP_MIN*60000);
  }
  const ranked = [...slots].sort((a,b)=>b.score - a.score);
  return { d, slots, lastTee, best: ranked[0] || null, ranked };
}

/* ---------- render ---------- */
function render(){
  let di = 0, a = analyseDay(0), note = '';
  if (STATE.focus != null && STATE.focus < STATE.data.days.length){
    const f = analyseDay(STATE.focus);
    if (f.slots.length){ di = STATE.focus; a = f; }
    else STATE.focus = null;
  }
  if (!a.slots.length && di === 0){
    for (let i = 1; i < STATE.data.days.length; i++){
      const nx = analyseDay(i);
      if (nx.slots.length){ di = i; a = nx; break; }
    }
    if (!di){ app.innerHTML = '<p class="msg">No playable windows in the forecast range.</p>'; return; }
    note = `<p class="msg" style="padding:0 0 14px">Today is done — last ${STATE.holes}-hole tee-off here is
      ${fmtHour(LAST_TEE[STATE.holes])}. Here's ${dayName(di)} instead.</p>`;
  }
  if (STATE.day !== di){ STATE.day = di; STATE.sel = null; }

  const key = s => s.start.getHours()*60 + s.start.getMinutes();
  const pick = STATE.sel != null ? (a.slots.find(s => key(s) === STATE.sel) || a.best) : a.best;

  const ribbon = a.slots.map(s => {
    const h = 20 + (s.score/100) * 54;
    return `<li aria-selected="${s === pick}"><button data-h="${key(s)}"
      aria-label="Tee at ${fmt(s.start)}, score ${s.score}">
      <span class="bar-fill" style="height:${h}px;background:${tone(s.score)}"></span></button></li>`;
  }).join('');

  const alts = a.ranked.filter(s => s !== pick).slice(0,3).map(s =>
    `<button class="alt" data-h="${key(s)}"><span>${fmt(s.start)}</span>
      <span class="alt-ic">${icon(conditionOf(s.slice).key, 16)}</span>
      <span class="alt-score" style="color:${tone(s.score)}">${s.score}</span></button>`).join('');

  CMP.hour = currentHour();
  app.innerHTML = note + `
   ${di ? `<button class="backday" id="back-today">← Back to ${analyseDay(0).slots.length ? 'today' : 'the next playable day'}</button>` : ''}
   <div class="hero">
     <div class="place">${esc(STATE.label)} · ${STATE.holes} holes · ${dayName(di)}${di ? ' ' + a.d.date.toLocaleDateString([], {day:'numeric', month:'short'}) : ''}</div>
     <h1 class="verdict">${verdictWord(a.best.score)} at <em>${fmt(a.best.start)}</em></h1>
     <p class="subline">${headline(a)}</p>
   </div>
   <div class="holes">
     <button data-holes="18" aria-pressed="${STATE.holes===18}">18 holes</button>
     <button data-holes="9" aria-pressed="${STATE.holes===9}">9 holes</button>
   </div>
   <div class="ribbon-wrap">
     <ul class="ribbon">${ribbon}</ul>
     <div class="scale"><span>${fmt(a.slots[0].start)}</span>
       <span>last tee ${fmt(a.lastTee)}</span></div>
   </div>
   ${detailHTML(pick)}
   ${alts ? `<h2 class="sec">Other slots ${di ? 'that day' : 'today'}</h2><div class="alts">${alts}</div>` : ''}
   ` + weekHTML(di);
  bind();
}

function dayName(di){
  if (di === 0) return 'today';
  if (di === 1) return 'tomorrow';
  return STATE.data.days[di].date.toLocaleDateString([], { weekday:'long' });
}

function detailHTML(w){
  const f = w.slice;
  const rows = [
    ['Rain', w.agg.rain, 45, Math.round(avg(f,'pop')) + '% · ' + sum(f,'precip').toFixed(1) + ' mm'],
    ['Wind', w.agg.wind, 35, Math.round(avg(f,'wind')) + ' mph, gusts ' + Math.round(Math.max(...f.map(h=>h.gust)))],
    ['Heat', w.agg.heat, 30, Math.round(avg(f,'feels')) + '°C felt · ' + Math.round(avg(f,'rh')) + '% humidity'],
    ['Daylight', w.darkMin > 0 ? 40 : 0, 40, w.darkMin > 0 ? Math.round(w.darkMin) + ' min past sunset' : 'Finishes in light']
  ].map(([k,pen,max,val])=>`
    <li><span class="k">${k}</span>
      <span class="track"><span style="width:${Math.min(100, pen/max*100)}%;background:${pen/max>.55?'var(--poor)':pen/max>.25?'var(--amber)':'var(--good)'}"></span></span>
      <span>${val}</span></li>`).join('');

  const N = STATE.holes;
  const pace = ROUND_MIN[N] / N;                       // minutes per hole
  const scoreBetween = (m0, m1) => {                   // weighted score over a minute range
    const t0 = w.start.getTime() + m0*60000, t1 = w.start.getTime() + m1*60000;
    let acc = 0, tot = 0, worstWhy = null, worstPen = -1, cond = [];
    w.parts.forEach(p => {
      const a = p.h.t.getTime(), b = a + 36e5;
      const ov = Math.min(b, t1) - Math.max(a, t0);
      if (ov <= 0) return;
      acc += p.score * ov; tot += ov; cond.push(p.h);
      const t = troubleOf(p.why);
      if (t && t.pen > worstPen){ worstPen = t.pen; worstWhy = t; }
    });
    return { score: tot ? Math.round(acc/tot) : 100, trouble: worstWhy, cond };
  };
  const groups = [];
  for (let h = 1; h <= N; h += 3){
    const hi = Math.min(N, h + 2);
    const m0 = (h - 1) * pace, m1 = hi * pace;
    const g = scoreBetween(m0, m1);
    groups.push({ h, hi, m0, ...g });
  }
  const timeline = groups.map(g => {
    const t = g.trouble;
    const c = conditionOf(g.cond.length ? g.cond : w.slice);
    return `<li>
      <span class="tl-time">${fmt(new Date(w.start.getTime() + g.m0*60000))}</span>
      <span class="tl-hole">${g.h === g.hi ? 'hole ' + g.h : 'holes ' + g.h + '–' + g.hi}</span>
      <span class="tl-icon" title="${c.word}">${icon(c.key, 15)}</span>
      <span class="track"><span style="width:${g.score}%;background:${tone(g.score)}"></span></span>
      <span class="tl-note">${t ? t.key + (t.pen > 22 ? ' — heavy' : t.pen > 12 ? ' — moderate' : ' — light') : 'Clear'}</span>
    </li>`;
  }).join('');

  return `<div class="detail">
    <div class="detail-top"><span class="tee">${fmt(w.start)}</span>
      <span class="score" style="color:${tone(w.score)}"><span class="score-icon">${icon(conditionOf(f).key, 26)}</span>${w.score}</span></div>
    <div class="detail-sub">In the clubhouse by ${fmt(w.finish)} · ${conditionOf(f).word} · ${verdictWord(w.score)}</div>
    <ul class="factors">${rows}</ul>
    <h3 class="tl-head">Through the round</h3>
    <ul class="timeline">${timeline}</ul>
    <p class="note">${advice(w, f[0])}</p>
  </div>`;
}

function advice(w, mid){
  const bits = [];
  const rough = w.parts.filter(p => p.score < 60);
  const carry = Math.round(((avg(w.slice,'temp') - 20) * 0.25) * 10) / 10;
  if (rough.length) bits.push('Roughest stretch is around <b>' + fmt(rough[0].h.t) + '</b>.');
  if (w.agg.storm > 20) bits.push('Thunder in the window — know your shelter.');
  if (avg(w.slice,'pop') > 45) bits.push('Rain gloves and a towel.');
  if (avg(w.slice,'feels') > 38) bits.push('Felt heat above 38°C — two litres of water and a wet towel.');
  if (Math.max(...w.slice.map(h=>h.gust)) > 20) bits.push('Gusts over 20 mph — a smoother, shorter swing tends to hold its line better.');
  if (carry > 0 && bits.length < 3) bits.push('Warm air adds about ' + carry + ' yards of driver carry.');
  if (!bits.length) bits.push('Clean conditions the whole way round. No club adjustment needed.');
  return bits.slice(0,3).join(' ');
}

function sumRecentRain(){ return STATE.data.days[0].rainSum || 0 }
const avg = (a,k)=> a.reduce((s,h)=>s+(h[k]||0),0)/a.length;
const sum = (a,k)=> a.reduce((s,h)=>s+(h[k]||0),0);
const fmtHour = dec => { const d = new Date(); d.setHours(Math.floor(dec), (dec%1)*60, 0, 0); return fmt(d); };

function headline(t){
  const b = t.best;

    : b.agg.wind > 14 ? 'the breeze builds later'

function weekHTML(focus){

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));



/* ---------- shared slider control ---------- */
let DRAGGING = false;

function bindSlider(o){
  const r = document.getElementById(o.range);
  if (!r) return;
  const val = document.getElementById(o.val), out = document.getElementById(o.out);
  const paint = v => { val.textContent = v; out.textContent = o.calc(v); };
  const apply = v => {
    v = Math.min(o.max, Math.max(o.min, Math.round(v)));
    r.value = v; o.set(v); paint(v);
  };
  r.addEventListener('input', () => { DRAGGING = true; apply(+r.value); });
  ['pointerup','touchend','mouseup','change','blur'].forEach(ev =>
    r.addEventListener(ev, () => { DRAGGING = false; }));
  document.getElementById(o.plus).onclick  = () => apply(o.get() + 1);
  document.getElementById(o.minus).onclick = () => apply(o.get() - 1);
}

/* ---------- green reader: AimPoint-style slope ---------- */
const TILT = { on:false, beta:null, gamma:null, zb:0, zg:0, flip:false, hold:null, putt:4 };   // putt = your read, in paces/yards

const pct = deg => Math.tan(deg * Math.PI/180) * 100;
const fingers = p => Math.max(0, Math.min(5, Math.round(Math.abs(p))));

function levelSVG(up, side){
  const c = 105, R = 78;
  const k = 9;                                          // px per 1% of slope
  const x = c + Math.max(-R, Math.min(R, side * k));
  const y = c + Math.max(-R, Math.min(R, -up * k));
  const rings = [26,52,78].map(r =>
    `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="1.2"/>`).join('');
  return `<svg viewBox="0 0 210 210" role="img" aria-label="Slope reading">
    ${rings}
    <line x1="${c-R}" y1="${c}" x2="${c+R}" y2="${c}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${c}" y1="${c-R}" x2="${c}" y2="${c+R}" stroke="var(--line)" stroke-width="1"/>
    <text x="${c}" y="16" text-anchor="middle" font-size="10" fill="var(--muted)">UPHILL</text>
    <text x="${c}" y="205" text-anchor="middle" font-size="10" fill="var(--muted)">DOWNHILL</text>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="var(--amber)" opacity="0.9"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="none" stroke="var(--chalk)" stroke-width="1.5"/>
  </svg>`;
}

/* Effective rolling resistance by green speed. Extra roll needed on a slope is
   D*(mu+s)/mu, so the PERCENTAGE is D-independent: pace change = slope/mu. */
const ROLL_MU = 0.062;   // typical green; slope % is distance-based, not stroke force

function paintGradient(){
  if (DRAGGING) return;
  const panel = document.getElementById('grad-panel');
  const el = document.getElementById('gradient');
  if (!panel || panel.hidden || !el) return;

  if (!TILT.on || TILT.beta == null){
    el.innerHTML = `<button class="cta" id="grad-on">Turn on slope reader</button>
      <p class="g-sub">Lay the phone flat on the green midway between ball and hole, top edge pointing at the hole.
      Not for use during a round — Rule 4.3a(1) forbids measuring slope with a device.</p>`;
    const b = document.getElementById('grad-on');
    if (b) b.onclick = enableTilt;
    return;
  }

  const live = { b: TILT.beta - TILT.zb, g: TILT.gamma - TILT.zg };
  const src = TILT.hold || live;
  const up = pct(src.b);                                  // + uphill toward the hole
  const side = pct(src.g) * (TILT.flip ? -1 : 1);          // + green falls to the right
  const f = fingers(side);
  const dir = Math.abs(side) < 0.3 ? null : (side > 0 ? 'LEFT' : 'RIGHT');   // aim to the high side
  const mu = ROLL_MU;
  let pace = (up / 100) / mu * 100;                       // % more or less pace
  pace = Math.max(-60, Math.min(120, pace));              // model breaks down at the extremes

  const aimBig = dir
    ? `<span class="big-n">${f}</span><span class="big-u">finger${f === 1 ? '' : 's'}</span>
       <span class="big-dir ${side > 0 ? 'is-left' : 'is-right'}">${dir}</span>`
    : `<span class="big-dir is-flat">STRAIGHT</span>`;

  const paceBig = Math.abs(pace) < 4
    ? `<span class="big-dir is-flat">NORMAL PACE</span><span class="big-ref">flat enough to ignore</span>`
    : `<span class="big-n">${pace > 0 ? '+' : '−'}${Math.abs(Math.round(pace))}<span class="big-pc">%</span></span>
       <span class="big-u">farther<br><span class="big-ref">play it as if the hole were<br>this much more distant</span></span>
       <span class="big-dir ${pace > 0 ? 'is-up' : 'is-down'}">${pace > 0 ? 'UPHILL' : 'DOWNHILL'}</span>`;

  el.innerHTML = `
    <div class="g-tiles">
      <div class="g-tile"><span class="g-cap">Aim</span>${aimBig}</div>
      <div class="g-tile"><span class="g-cap">Distance</span>${paceBig}</div>
    </div>
    <div class="putt-calc">
      <span class="g-cap">Your read</span>
      <p class="dial-val"><span id="p-val">${TILT.putt}</span><small>paces</small></p>
      <div class="dial-row">
        <button id="p-down" aria-label="One less pace">−</button>
        <input id="p-dist" type="range" min="1" max="30" step="1" value="${TILT.putt}" aria-label="Putt distance in paces">
        <button id="p-up" aria-label="One more pace">+</button>
      </div>
      <p class="putt-out">play it as <b id="p-out">${Math.round(TILT.putt * (1 + pace/100))}</b> paces</p>
    </div>
    <p class="g-line">Break <b>${Math.abs(side).toFixed(1)}%</b> · slope <b>${up >= 0 ? '+' : '−'}${Math.abs(up).toFixed(1)}%</b></p>
    ${levelSVG(up, side)}
    <div class="g-acts">
      <button id="g-hold">${TILT.hold ? 'Live' : 'Hold'}</button>
      <button id="g-zero">Zero</button>
      <button id="g-flip">Flip L/R</button>
      </div>
    <p class="g-sub">Fingers at arm's length, inside edge on the hole, aim the outer edge.
    The distance figure holds at any putt length; your stroke for that distance stays your own feel. Break fingers are calibrated for putts inside about 5 yds.
    Practice only — a device may not be used to read slope during a round.</p>`;

  document.getElementById('g-hold').onclick = () => { TILT.hold = TILT.hold ? null : { ...live }; paintGradient(); };
  document.getElementById('g-zero').onclick = () => { TILT.zb = TILT.beta; TILT.zg = TILT.gamma; TILT.hold = null; paintGradient(); };
  document.getElementById('g-flip').onclick = () => { TILT.flip = !TILT.flip; paintGradient(); };

  bindSlider({
    range: 'p-dist', minus: 'p-down', plus: 'p-up', val: 'p-val', out: 'p-out',
    min: 1, max: 30,
    get: () => TILT.putt,
    set: v => { TILT.putt = v; },
    calc: v => Math.round(v * (1 + pace/100))
  });
}

  if (ok){ TILT.on = true; paintGradient(); }
}

/* ---------- pre-shot wind compass (GPS only) ---------- */
const CMP = { heading: null, on: false, hour: null, yds: 150 };

function currentHour(){
  if (!STATE.data) return null;
  const now = Date.now();
  return STATE.data.hours.find(h => h.t.getTime() <= now && now < h.t.getTime() + 36e5)
      || STATE.data.hours[0];
}

function windComponents(windMph, fromDeg, headingDeg){
  const rel = ((fromDeg - headingDeg) % 360 + 360) % 360;   // where wind comes from, relative to aim
  const rad = rel * Math.PI / 180;
  const head = windMph * Math.cos(rad);      // + into your face
  const cross = -windMph * Math.sin(rad);    // + pushes ball right
  return { rel, head, cross };
}

function compassSVG(rel, heading, wind){
  const ticks = [['N',0],['E',90],['S',180],['W',270]].map(([l,deg]) => {
    const a = (deg - (heading || 0)) * Math.PI/180;
    const x = 66 + Math.sin(a)*50, y = 66 - Math.cos(a)*50;
    return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle"
      font-size="11" font-weight="700" fill="${l==='N'?'var(--amber)':'var(--muted)'}">${l}</text>`;
  }).join('');
  const a = rel * Math.PI/180;                       // arrow points FROM the wind source inward
  const x1 = 66 + Math.sin(a)*38, y1 = 66 - Math.cos(a)*38;
  const x2 = 66 - Math.sin(a)*20, y2 = 66 + Math.cos(a)*20;
  return `<svg viewBox="0 0 132 132" role="img" aria-label="Wind ${Math.round(wind)} mph">
    <circle cx="66" cy="66" r="58" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <circle cx="66" cy="66" r="30" fill="none" stroke="var(--line)" stroke-width="1"/>
    <path d="M66 6 l5 8 h-10 z" fill="var(--muted)"/>
    ${ticks}
    <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--amber)"/></marker></defs>
    <line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
      stroke="var(--amber)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)"/>
    <rect x="42" y="112" width="48" height="19" rx="9.5" fill="var(--moss-2)" stroke="var(--line)"/>
    <text x="66" y="125.5" text-anchor="middle" font-size="11.5" font-weight="800"
      fill="var(--chalk)" font-family="Karla, sans-serif">${Math.round(wind)} mph</text>
  </svg>`;
}

function miniDial(rel){
  const a = rel * Math.PI/180;
  const x1 = 17 + Math.sin(a)*11, y1 = 17 - Math.cos(a)*11;
  const x2 = 17 - Math.sin(a)*7,  y2 = 17 + Math.cos(a)*7;
  return `<svg viewBox="0 0 34 34" aria-hidden="true">
    <circle cx="17" cy="17" r="15" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
      stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="17" cy="17" r="2" fill="var(--amber)"/></svg>`;
}

function miniDial(rel, size){
  const c = size/2, R = c*0.62, r2 = c*0.4;
  const a = rel * Math.PI/180;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${c}" cy="${c}" r="${c*0.88}" fill="none" stroke="var(--line)" stroke-width="1.5"/>
    <line x1="${(c+Math.sin(a)*R).toFixed(1)}" y1="${(c-Math.cos(a)*R).toFixed(1)}"
          x2="${(c-Math.sin(a)*r2).toFixed(1)}" y2="${(c+Math.cos(a)*r2).toFixed(1)}"
      stroke="var(--amber)" stroke-width="${(size*0.11).toFixed(1)}" stroke-linecap="round"/>
    <circle cx="${c}" cy="${c}" r="${(size*0.07).toFixed(1)}" fill="var(--amber)"/></svg>`;
}

function paintCompass(){
  if (DRAGGING) return;
  const btn = document.getElementById('wind-toggle');
  const panel = document.getElementById('wind-panel');
  if (!btn || !panel) return;
  const h = CMP.hour || currentHour();
  if (!h) return;

  const known = CMP.on && CMP.heading != null;
  const c = known ? windComponents(h.wind, h.dir, CMP.heading) : null;
  btn.innerHTML = `${icon('wind', 19)}Wind ${Math.round(h.wind)} mph`;

  if (panel.hidden) return;                       // collapsed — nothing more to draw
  const el = document.getElementById('compass');
  if (!known){
    el.innerHTML = `<p class="read"><b>${Math.round(h.wind)} mph</b> from the ${compassPoint(h.dir)}, gusting ${Math.round(h.gust)}</p>
      <button class="cta" id="cmp-on">Turn on compass</button>
      <p class="sub">${STATE.gps
        ? 'Aim your phone down the target line and the dial reads the wind relative to your shot.'
        : 'Showing forecast wind for ' + esc(STATE.label) + '. Tap "Use my location" for readings where you are standing.'}</p>`;
    const b = document.getElementById('cmp-on');
    if (b) b.onclick = enableCompass;
    return;
  }
  const yardsL = Math.abs(c.head) * 0.95, yardsC = Math.abs(c.cross) * 0.85;
  const along = c.head > 1 ? `wind is holding it up — consider a little more club`
              : c.head < -1 ? `wind is helping — consider a little less club`
              : 'your normal number should hold';
  const side = Math.abs(c.cross) < 1 ? '' :
    ` · drifts <b>${Math.round(yardsC)} yds ${c.cross > 0 ? 'right' : 'left'}</b>`;
  el.innerHTML = compassSVG(c.rel, CMP.heading, h.wind) +
    `<div class="read"><b>${labelRel(c.rel)}</b> — ${along}${side}</div>
     <div class="putt-calc">
       <span class="g-cap">Your shot</span>
       <p class="dial-val"><span id="w-val">${CMP.yds}</span><small>yards</small></p>
       <div class="dial-row">
         <button id="w-down" aria-label="Five yards less">−</button>
         <input id="w-dist" type="range" min="100" max="200" step="1" value="${CMP.yds}" aria-label="Shot distance in yards">
         <button id="w-up" aria-label="Five yards more">+</button>
       </div>
       <p class="putt-out">plays like <b id="w-out">${Math.round(CMP.yds + c.head * 0.95 * (CMP.yds/150))}</b> yards</p>
     </div>
     <p class="sub">Gusting to ${Math.round(h.gust)} mph · from the ${compassPoint(h.dir)} · point the phone at your target${STATE.gps ? '' : ' · forecast is for ' + esc(STATE.label)}</p>`;

  bindSlider({
    range: 'w-dist', minus: 'w-down', plus: 'w-up', val: 'w-val', out: 'w-out',
    min: 100, max: 200,
    get: () => CMP.yds,
    set: v => { CMP.yds = v; },
    calc: v => Math.round(v + c.head * 0.95 * (v / 150))
  });
}

function compassPoint(deg){
  return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][
    Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
}

function labelRel(rel){
  if (rel < 30 || rel > 330) return 'Into the wind';
  if (rel > 150 && rel < 210) return 'Downwind';
  return rel < 180 ? 'Cross, left to right' : 'Cross, right to left';
}

function onOrient(e){
  if (e.beta != null && e.gamma != null){
    const moved = TILT.beta == null ||
      Math.abs(e.beta - TILT.beta) > 0.08 || Math.abs(e.gamma - TILT.gamma) > 0.08;
    TILT.beta = TILT.beta == null ? e.beta : TILT.beta * 0.7 + e.beta * 0.3;   // smoothing
    TILT.gamma = TILT.gamma == null ? e.gamma : TILT.gamma * 0.7 + e.gamma * 0.3;
    if (moved && TILT.on && !TILT.hold) paintGradient();
  }
  let hd = e.webkitCompassHeading;
  if (hd == null && e.alpha != null) hd = (360 - e.alpha) % 360;
  if (hd == null) return;
  if (CMP.heading == null || Math.abs(hd - CMP.heading) > 1.5){ CMP.heading = hd; paintCompass(); }
}

async function askOrientation(){
  try {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function'){
      if (await DOE.requestPermission() !== 'granted') return false;
    }
    window.addEventListener('deviceorientation', onOrient, true);
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    return true;
  } catch { return false; }
}

async function enableCompass(){
  const ok = await askOrientation();
  if (ok){ CMP.on = true; paintCompass(); }
}

/* ---------- notes (saved on this device) ---------- */
const NOTE_KEY = 'teewindow-notes';
const SEED_KEY = 'teewindow-seeded';
const SEED_NOTE = { t: 'Setup: good neutral grip and flush lie\nSwing: left shoulder over right toe, right shoulder over left toe',
                    d: 'Swing thoughts', pin: true };
let NOTES = [];
try {
  NOTES = JSON.parse(localStorage.getItem(NOTE_KEY) || '[]');
  if (!localStorage.getItem(SEED_KEY)){        // first run on this device
    NOTES.push({ ...SEED_NOTE });
    localStorage.setItem(SEED_KEY, '1');
    localStorage.setItem(NOTE_KEY, JSON.stringify(NOTES));
  }
} catch { NOTES = [{ ...SEED_NOTE }]; }

function saveNotes(){
  try { localStorage.setItem(NOTE_KEY, JSON.stringify(NOTES)); return true; }
  catch { return false; }
}

function paintNotes(){
  const list = document.getElementById('note-list');
  const state = document.getElementById('note-state');
  if (!list) return;
  const order = NOTES.map((n, i) => ({ n, i })).sort((a, b) => (a.n.pin ? 1 : 0) - (b.n.pin ? 1 : 0));
  list.innerHTML = order.map(({ n, i }) => `<li${n.pin ? ' class="pinned"' : ''}>
      <span><span class="txt">${esc(n.t)}</span><span class="meta">${n.pin ? '📌 ' : ''}${esc(n.d)}</span></span>
      <button class="del" data-i="${i}" aria-label="Delete note">✕</button>
    </li>`).join('');
  list.querySelectorAll('.del').forEach(b => b.onclick = () => {
    NOTES.splice(+b.dataset.i, 1); saveNotes(); paintNotes();
  });
  state.textContent = NOTES.length
    ? NOTES.length + (NOTES.length === 1 ? ' note saved' : ' notes saved')
    : 'Saved on this device only';
}

function initNotes(){
  const input = document.getElementById('note-input');
  const save = document.getElementById('note-save');
  save.onclick = () => {
    const t = input.value.trim();
    if (!t) return;
    NOTES.unshift({ t, d: new Date().toLocaleString([], { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }) });
    const ok = saveNotes();
    input.value = '';
    paintNotes();
    if (!ok) document.getElementById('note-state').textContent = 'Could not save — storage is blocked here';
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) save.click();
  });
  paintNotes();
}

/* ---------- keep the screen on while playing ---------- */
const WAKE = { lock: null, want: true, supported: 'wakeLock' in navigator };

async function acquireWake(){
  if (!WAKE.supported || !WAKE.want || WAKE.lock || document.visibilityState !== 'visible') return;
  try {
    WAKE.lock = await navigator.wakeLock.request('screen');
    WAKE.lock.addEventListener('release', () => { WAKE.lock = null; });
  } catch { /* denied, low battery, or unsupported browser */ }
}
async function releaseWake(){
  try { await WAKE.lock?.release(); } catch {}
  WAKE.lock = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWake();
});
['click','touchend'].forEach(ev =>
  document.addEventListener(ev, () => acquireWake(), { once: true, passive: true }));

const awakeBtn = document.getElementById('awake');
if (!WAKE.supported){
  awakeBtn.hidden = true;
} else {
  awakeBtn.onclick = () => {
    WAKE.want = !WAKE.want;
    awakeBtn.setAttribute('aria-pressed', String(WAKE.want));
    awakeBtn.textContent = WAKE.want
      ? 'Screen stays awake · tap to allow sleep'
      : 'Screen may sleep · tap to keep it awake';
    WAKE.want ? acquireWake() : releaseWake();
  };
}
acquireWake();

function setTheme(mode){
  const root = document.documentElement;
  if (mode === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', mode);
  document.querySelectorAll('.theme button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.themeSet === mode)));
  try { localStorage.setItem('teewindow-theme', mode); } catch {}
}

  b.onclick = () => setTheme(b.dataset.themeSet));

];
const sel = $('#courses');
sel.innerHTML = '<option value="">Jump to a course…</option>' +
  COURSES.map(([region, list]) => '<optgroup label="' + region + '">' +
    list.map(c => `<option value="${c[1]},${c[2]}">${c[0]}</option>`).join('') +
    '</optgroup>').join('');
sel.onchange = () => {
  if (!sel.value) return;
  STATE.gps = false;
  const [la, lo] = sel.value.split(',');
  load(la, lo, sel.options[sel.selectedIndex].text);
};

function fail(m){ app.innerHTML = '<p class="msg err">' + m + '</p>' }

const FLAT = COURSES.flatMap(([region, list]) => list.map(c => ({ name:c[0], lat:c[1], lon:c[2], region })));
const norm = t => t.toLowerCase().replace(/[^a-z0-9 ]/g,'');

function matchCourses(q){
  const n = norm(q); if (n.length < 2) return [];
  const words = n.split(/\s+/).filter(Boolean);
  return FLAT.map(c => {
    const hay = norm(c.name + ' ' + c.region);
    if (!words.every(w => hay.includes(w))) return null;
    return { c, rank: hay.startsWith(words[0]) ? 0 : 1 };
  }).filter(Boolean).sort((a,b)=>a.rank-b.rank).slice(0,7).map(x=>x.c);
}

function showResults(items){
  const list = $('#results');
  if (!items.length){ list.hidden = true; list.innerHTML = ''; return; }
  list.hidden = false;
  list.innerHTML = items.map(i =>
    `<li><button data-lat="${i.lat}" data-lon="${i.lon}" data-l="${esc(i.label)}">
      ${i.kind === 'course' ? '<span class="tag">course</span> ' : ''}${esc(i.title)}
      <span style="color:var(--muted)"> ${esc(i.sub || '')}</span></button></li>`).join('');
  list.querySelectorAll('button').forEach(b => b.onclick = () => {
    list.hidden = true; $('#q').value = b.dataset.l; STATE.gps = false;
    load(b.dataset.lat, b.dataset.lon, b.dataset.l);
  });
}

function localResults(q){
  return matchCourses(q).map(c => ({
    kind:'course', title:c.name.split(',')[0], sub:c.region,
    label:c.name, lat:c.lat, lon:c.lon
  }));
}

let searchTimer;
$('#q').addEventListener('input', () => {
  const q = $('#q').value.trim();
  document.getElementById('clear').hidden = !q;
  if (!q){ $('#results').hidden = true; }
  showResults(localResults(q));
  clearTimeout(searchTimer);
  if (q.length >= 3) searchTimer = setTimeout(() => search(true), 350);
});

async function search(quiet){
  const q = $('#q').value.trim(); if (!q) return;
  const local = localResults(q);
  showResults(local);
  try {
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=5&name=' + encodeURIComponent(q));
    const j = await r.json();
    const places = (j.results || []).map(p => ({
      kind:'place', title:p.name, sub:[p.admin1, p.country].filter(Boolean).join(', '),
      label:p.name + (p.admin1 ? ', ' + p.admin1 : '') + ', ' + p.country,
      lat:p.latitude, lon:p.longitude
    }));
    if (local.length || places.length) showResults([...local, ...places]);
    else if (!quiet) showBanner('Nothing matched that. Try a nearby city, or browse the course list.');
  } catch {
    if (!local.length && !quiet)
      showBanner('City search needs an outside connection, which this window blocks. The course list still works offline.');
  }
}

$('#go').onclick = search;
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

function nearestLabel(lat, lon){
  let best = null;
  FLAT.forEach(c => {
    const dx = (c.lat - lat) * 111, dy = (c.lon - lon) * 107;
    const d = Math.hypot(dx, dy);
    if (!best || d < best.d) best = { d, c };
  });
  return best && best.d < 12 ? 'Near ' + best.c.name.split(',')[0] : 'Your location';
}

function useGPS(auto){
  if (!navigator.geolocation){
    if (!auto) fail('This browser will not share a location. Pick a course or search instead.');
    return;
  }
  if (!auto) app.innerHTML = '<p class="msg">Finding you…</p>';
  navigator.geolocation.getCurrentPosition(
    p => {
      const la = +p.coords.latitude.toFixed(4), lo = +p.coords.longitude.toFixed(4);
      STATE.gps = true;
      load(la, lo, nearestLabel(la, lo));
    },
    () => { if (!auto) fail('Location sharing is off here. Pick a course below, or open the site in Safari to use GPS.'); },
    { timeout: 10000, maximumAge: 300000 }
  );
}
$('#gps').onclick = () => useGPS(false);

initNotes();

/* first paint: Metro Manila, then quietly ask for the real location */
load(14.5800, 121.0000, 'Metro Manila');
useGPS(true);
</script>
